<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dynamic Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Secure Dynamic Task Manager</h1>

        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Enter a task">
            <button id="addTaskBtn">Add Task</button>
            <button id="loadSamplesBtn">Load Sample Tasks</button>
        </div>

        <p id="taskMessage" class="error-message"></p>

        <div class="summary-container">
            <span>Total Tasks: <strong id="totalCount">0</strong></span>
            <span>Pending: <strong id="pendingCount">0</strong></span>
            <span>Completed: <strong id="completedCount">0</strong></span>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
